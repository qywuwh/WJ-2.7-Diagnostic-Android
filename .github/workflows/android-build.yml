name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Name artifacts
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/WJ-Diagnostic-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/WJ-Diagnostic.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk out/WJ-Diagnostic-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WJ-Diagnostic-Android
          path: out/*.apk
          if-no-files-found: error
